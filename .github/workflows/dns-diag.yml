name: dns-diag

on:
  workflow_dispatch:

jobs:
  dns-check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euxo pipefail
          echo "=== NS ==="
          dig +short sidhesh.online NS
          echo "=== A records ==="
          for n in fe-api mail api ws www "@"; do
            echo "--- $n.sidhesh.online ---"
            dig +short "$n.sidhesh.online" A
          done
          echo "=== fe-api verbose ==="
          dig fe-api.sidhesh.online A +noall +comments +authority +answer
          echo "=== www CNAME ==="
          dig +short www.sidhesh.online CNAME
          echo "=== MX ==="
          dig +short sidhesh.online MX
          echo "=== HTTPS test ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" --max-time 15 https://fe-api.sidhesh.online/api/health || echo "curl failed"
