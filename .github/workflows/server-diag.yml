name: server-diag

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail
            echo "=== service ==="
            sudo systemctl is-active fake-email || true
            echo "=== DATABASE_URL host (redacted) ==="
            sudo grep DATABASE_URL /etc/fake-email/env | sed -E 's#(://)[^:@]+:[^@]+@#\1***:***@#'
            echo "=== DB reachability ==="
            HOST=$(sudo grep DATABASE_URL /etc/fake-email/env | sed -E 's#.*@([^/]+)/.*#\1#' | cut -d: -f1)
            echo "host=$HOST"
            timeout 10 bash -c "cat < /dev/null > /dev/tcp/$HOST/5432" && echo "DB_PORT_OPEN" || echo "DB_PORT_FAIL"
            echo "=== try psql ==="
            DB=$(sudo grep DATABASE_URL /etc/fake-email/env | cut -d= -f2-)
            PGCONNECT_TIMEOUT=10 psql "$DB" -c "select 1" 2>&1 | head -5 || true
            echo "=== recent logs ==="
            sudo journalctl -u fake-email -n 30 --no-pager | tail -25
