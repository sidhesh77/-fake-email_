name: diag-key

on:
  workflow_dispatch:

jobs:
  check-key:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euxo pipefail
          printf '%s\n' "$KEY" > /tmp/k.pem
          chmod 600 /tmp/k.pem
          echo "---- first/last lines ----"
          head -1 /tmp/k.pem
          tail -1 /tmp/k.pem
          echo "---- line count ----"
          wc -l /tmp/k.pem
          echo "---- key fingerprint ----"
          if ssh-keygen -y -f /tmp/k.pem 2>/tmp/keyerr | ssh-keygen -l -f -; then
            echo "KEY_PARSE_OK"
          else
            echo "KEY_PARSE_FAIL"
            cat /tmp/keyerr
          fi
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
      - run: |
          ssh -i /tmp/k.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=10 \
            ubuntu@"$HOST" 'echo SSH_DIAG_OK; hostname' || echo SSH_DIAG_FAIL
        env:
          HOST: ${{ secrets.EC2_HOST }}
      - run: |
          timeout 12 bash -c 'cat < /dev/null > /dev/tcp/65.0.45.223/25' \
            && echo "PORT25_OK_FROM_INTERNET" || echo "PORT25_FAIL_FROM_INTERNET"
      - run: |
          timeout 12 bash -c 'cat < /dev/null > /dev/tcp/65.0.45.223/443' \
            && echo "PORT443_OK_FROM_INTERNET" || echo "PORT443_FAIL_FROM_INTERNET"
