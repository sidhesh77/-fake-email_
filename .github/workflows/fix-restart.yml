name: fix-restart

on:
  workflow_dispatch:

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euxo pipefail
            echo "=== resolv.conf ==="
            cat /etc/resolv.conf
            echo "=== test DNS resolution ==="
            getent hosts ep-flat-water-aomtcvez-pooler.c-2.ap-southeast-1.aws.neon.tech || echo "DNS_RESOLVE_FAIL"
            echo "=== restart service ==="
            sudo systemctl restart fake-email
            sleep 5
            sudo systemctl is-active fake-email
            echo "=== health check ==="
            curl -sf --max-time 5 http://127.0.0.1:3001/api/health && echo " -> HEALTH_OK" || {
              echo "HEALTH_FAIL"
              sudo journalctl -u fake-email -n 15 --no-pager
              exit 1
            }
